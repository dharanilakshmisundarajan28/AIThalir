{% extends "base.html" %}

{% block title %}Crop Recommendation - AgriConnect{% endblock %}

{% block extra_head %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #f3f6f2;
    --panel: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --green: #1f7a32;
    --green-2: #0f8d68;
    --border: rgba(15, 23, 42, 0.08);
    --shadow: 0 16px 34px rgba(15, 23, 42, 0.08);
  }

  body {
    background: var(--page-bg);
    font-family: Inter, sans-serif;
  }

  .crop-shell {
    max-width: 1120px;
    margin: 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }

  .section-title {
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .input-field {
    width: 100%;
    border: 1px solid #d8e1dd;
    border-radius: 14px;
    padding: 0.86rem 0.95rem;
    font-size: 0.95rem;
    outline: none;
    transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    background: #fff;
  }

  .input-field:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1);
  }

  .btn-primary {
    background: linear-gradient(135deg, #1f7a32 0%, #0f8d68 100%);
    color: #fff;
    border: 0;
    border-radius: 16px;
    padding: 0.95rem 1.15rem;
    font-weight: 800;
    box-shadow: 0 12px 24px rgba(31, 122, 50, 0.22);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 16px 28px rgba(31, 122, 50, 0.26);
  }

  .btn-ghost {
    background: #20293d;
    color: #fff;
    border: 0;
    border-radius: 9999px;
    padding: 0.9rem 1.35rem;
    font-weight: 800;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .btn-ghost:hover {
    transform: translateY(-1px);
    opacity: 0.96;
  }

  .btn-soft {
    background: #dfe8f3;
    color: #111827;
    border: 0;
    border-radius: 16px;
    padding: 0.95rem 1.25rem;
    font-weight: 800;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .btn-soft:hover {
    transform: translateY(-1px);
  }

  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.1rem;
  }

  .page-head h2 {
    margin: 0;
    font-size: clamp(2rem, 3vw, 3rem);
    line-height: 1;
    letter-spacing: -0.06em;
    font-weight: 900;
    color: #0f172a;
  }

  .stat-card,
  .roadmap-card,
  .info-card {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
  }

  .hero-image {
    position: relative;
    overflow: hidden;
    min-height: 320px;
    background: #0f172a;
  }

  .hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-image .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.02) 0%, rgba(15, 23, 42, 0.62) 100%);
  }

  .hero-image .caption {
    position: absolute;
    left: 1.2rem;
    bottom: 1rem;
    color: #fff;
    font-size: 1.3rem;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: -0.04em;
    text-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  .quick-stat {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.7rem 0.1rem;
  }

  .quick-icon {
    width: 3rem;
    height: 3rem;
    border-radius: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #edf4e9;
    color: #1a5d1f;
    flex: 0 0 auto;
  }

  .quick-label {
    font-size: 0.68rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #718096;
    margin-bottom: 0.15rem;
  }

  .quick-value {
    font-size: 0.98rem;
    font-weight: 900;
    color: #0f172a;
    line-height: 1.2;
  }

  .summary-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #fff;
    padding: 1rem 1.1rem;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    color: #1f2937;
    line-height: 1.62;
    font-size: 0.93rem;
  }

  .summary-card strong {
    font-weight: 900;
    color: #0f172a;
  }

  .recommendation-list {
    display: grid;
    gap: 0.65rem;
  }

  .recommendation-option {
    display: grid;
    grid-template-columns: 2rem minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.8rem;
    border: 1px solid #dbe8dc;
    border-radius: 14px;
    background: #fafffa;
    width: 100%;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .recommendation-option:hover,
  .recommendation-option:focus-visible {
    border-color: #86c991;
    outline: none;
    transform: translateY(-1px);
  }

  .recommendation-option.is-selected {
    border-color: #86c991;
    background: #eff9ee;
  }

  .recommendation-rank {
    display: inline-flex;
    width: 2rem;
    height: 2rem;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    background: #dcecdc;
    color: #1f5f20;
    font-size: 0.8rem;
    font-weight: 900;
  }

  .recommendation-option.is-selected .recommendation-rank {
    background: #1f7a32;
    color: #fff;
  }

  .recommendation-name { font-weight: 900; color: #0f172a; }
  .recommendation-probability { font-size: 0.88rem; font-weight: 900; color: #1f7a32; }

  .roadmap-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.8rem;
  }

  .roadmap-step {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #2e7d32;
    color: #fff;
    font-weight: 900;
    margin-bottom: 1rem;
    box-shadow: 0 10px 18px rgba(46, 125, 50, 0.18);
  }

  .roadmap-step.soft {
    background: #c2d8c1;
    color: #194d1a;
    box-shadow: none;
  }

  .roadmap-card {
    text-align: center;
    padding: 1rem 0.9rem;
  }

  .roadmap-card h4 {
    margin: 0 0 0.55rem;
    font-size: 0.96rem;
    font-weight: 900;
    color: #111827;
  }

  .roadmap-card p {
    margin: 0;
    font-size: 0.88rem;
    line-height: 1.5;
    color: #475569;
  }

  .roadmap-chip {
    display: inline-flex;
    align-items: center;
    border-radius: 9999px;
    background: #e8f0e5;
    color: #1f5f20;
    padding: 0.28rem 0.7rem;
    margin-top: 1rem;
    font-size: 0.72rem;
    font-weight: 900;
  }

  .info-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.8rem;
    padding: 0.85rem 1rem;
    background: #1d6e25;
    color: #fff;
    border-radius: 18px 18px 0 0;
  }

  .info-header h3 {
    margin: 0;
    font-size: 1rem;
    font-weight: 900;
  }

  .info-body {
    padding: 0.95rem 1rem 1rem;
  }

  .finance-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
  }

  .finance-row:last-child {
    border-bottom: 0;
  }

  .finance-row span:first-child,
  .tech-label {
    color: #334155;
    font-size: 0.88rem;
    font-weight: 500;
  }

  .finance-row span:last-child,
  .tech-value {
    color: #0f172a;
    font-size: 0.92rem;
    font-weight: 900;
  }

  .tech-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.7rem;
  }

  .tech-chip {
    border-radius: 12px;
    background: #f6f8fb;
    padding: 0.95rem 0.8rem;
    text-align: center;
  }

  .tech-chip .small {
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 0.2rem;
  }

  .subtle {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .toast-stack {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 60;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    pointer-events: none;
  }

  .toast {
    pointer-events: auto;
    min-width: 260px;
    max-width: 360px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1f7a32 0%, #0f8d68 100%);
    color: #fff;
    box-shadow: 0 16px 34px rgba(15, 23, 42, 0.2);
    padding: 0.9rem 1rem;
    font-size: 0.95rem;
    font-weight: 800;
  }

  .result-actions {
    display: flex;
    gap: 0.9rem;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.95rem;
  }

  .result-head h2 {
    margin: 0;
    font-size: clamp(1.55rem, 2.8vw, 2.5rem);
    line-height: 1;
    letter-spacing: -0.06em;
    font-weight: 900;
    color: #111827;
  }

  .result-subtle {
    margin-top: 0.45rem;
    font-size: 0.88rem;
    color: #0f766e;
    font-weight: 600;
  }

  .result-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr);
    gap: 0.9rem;
    align-items: start;
  }

  .stack-gap {
    display: grid;
    gap: 0.8rem;
  }

  .footer-actions {
    display: flex;
    gap: 0.9rem;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(148, 163, 184, 0.16);
  }

  .muted-note {
    margin-top: 0.85rem;
    font-size: 0.82rem;
    color: #64748b;
    font-style: italic;
  }

  @media (max-width: 1024px) {
    .result-grid,
    .roadmap-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .hero-image {
      min-height: 240px;
    }

    .hero-image .caption {
      font-size: 1.05rem;
    }

    .page-head,
    .result-head {
      flex-direction: column;
    }

    .result-actions {
      justify-content: flex-start;
    }

    .tech-grid {
      grid-template-columns: 1fr;
    }

  }

  .btn-simulation {
    background: linear-gradient(145deg, #2563eb, #1d4ed8);
    color: white;
    border: none;
    border-radius: 16px;
    padding: 0.95rem 1.4rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 0 #163ea5, 0 14px 24px rgba(37,99,235,.35);
    transition: all .15s ease;
  }

  .btn-simulation:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #163ea5, 0 18px 28px rgba(37,99,235,.4); }
  .btn-simulation:active { transform: translateY(6px); box-shadow: 0 2px 0 #163ea5, 0 5px 10px rgba(37,99,235,.3); }
</style>
{% endblock %}

{% block content %}
<div class="px-4 py-4 md:py-6">
  <div class="crop-shell">
    <div class="panel overflow-hidden">
      <div id="formView" class="px-5 pt-5 md:px-8 md:pt-6">
        <div class="section-title text-emerald-700">Crop inputs</div>
      </div>

      <div class="p-5 md:p-8">
        <div id="formViewBody">
          <form id="recommendationForm" class="space-y-5">
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Nitrogen (N) mg/kg</label>
                <input type="number" step="1" min="0" max="140" name="nitrogen" placeholder="0 - 140" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Phosphorus (P) mg/kg</label>
                <input type="number" step="1" min="5" max="145" name="phosphorus" placeholder="5 - 145" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Potassium (K) mg/kg</label>
                <input type="number" step="1" min="5" max="205" name="potassium" placeholder="5 - 205" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Soil pH Level</label>
                <input type="number" step="0.01" min="3.50" max="9.94" name="ph" placeholder="3.50 - 9.94" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Temperature (C)</label>
                <input type="number" step="0.01" min="8.83" max="43.68" name="temperature" placeholder="8.83 - 43.68" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Humidity (%)</label>
                <input type="number" step="0.01" min="14.26" max="99.98" name="humidity" placeholder="14.26 - 99.98" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Rainfall (mm)</label>
                <input type="number" step="0.01" min="20.21" max="298.56" name="rainfall" placeholder="20.21 - 298.56" required class="input-field">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Acreage (acres)</label>
                <input type="number" step="0.1" min="0.1" max="100" name="acreage" placeholder="0.1 - 100" value="1" required class="input-field">
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-bold text-slate-700 mb-2">Location (for weather)</label>
                <input type="text" name="location" id="location" placeholder="City name" class="input-field">
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
              <button type="button" onclick="getLiveWeather()" class="btn-soft inline-flex items-center justify-center gap-2">
                <i class="fas fa-cloud-sun"></i>
                Get Live Weather
              </button>
              <button type="submit" class="btn-primary w-full sm:w-auto inline-flex items-center justify-center gap-2">
                <i class="fas fa-seedling"></i>
                Get Crop Recommendation
              </button>
            </div>
          </form>
        </div>

        <div id="resultView" class="hidden">
          <div class="result-head">
            <div>
              <div class="section-title text-emerald-700 mb-2">Crop Details</div>
              <h2 id="resultTitle">Crop Details</h2>
              <div class="result-subtle" id="resultSubtle">Suitable crop selected for your farm.</div>
            </div>
          </div>

          <div id="recommendationResult" class="stack-gap"></div>

          <div class="footer-actions">
            <button
                type="button"
                class="btn-ghost inline-flex items-center gap-2"
                onclick="showFormView()">
                <i class="fas fa-arrow-left"></i>
                  Back
            </button>

            <!-- New 3D Simulation Button -->
            <button
                type="button"
                class="btn-simulation inline-flex items-center gap-2"
                onclick="startSimulation()">
                <i class="fas fa-play-circle"></i>
                3D Simulation
            </button>

            <button
              type="button"
              class="btn-primary inline-flex items-center gap-2"
              onclick="createPlan()">
              <i class="fas fa-clipboard-list"></i>
              Go with this plan
            </button>
        </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div id="toastStack" class="toast-stack"></div>
{% endblock %}

{% block extra_scripts %}

let lastRecommendation = null;
let recommendationState = {
  recommendations: [],
  economicsByCrop: {},
  parameters: {},
  selectedIndex: 0
};

function showFormView() {
  document.getElementById('resultView').classList.add('hidden');
  document.getElementById('formView').classList.remove('hidden');
  document.getElementById('formViewBody').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResultView() {
  document.getElementById('formView').classList.add('hidden');
  document.getElementById('formViewBody').classList.add('hidden');
  document.getElementById('resultView').classList.remove('hidden');
  document.getElementById('resultView').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toast(message) {
  const stack = document.getElementById('toastStack');
  const node = document.createElement('div');
  node.className = 'toast';
  node.textContent = message;
  stack.appendChild(node);
  window.setTimeout(() => {
    node.style.opacity = '0';
    node.style.transform = 'translateY(8px)';
    window.setTimeout(() => node.remove(), 240);
  }, 2600);
}

function setupRangeValidation(form) {
  const fields = Array.from(form.querySelectorAll('input[type="number"]'));

  const validateField = (field) => {
    if (!field.min && !field.max) return true;

    const value = field.value.trim();
    if (value === '') {
      field.setCustomValidity('This field is required.');
      return false;
    }

    const number = Number(value);
    const min = field.min !== '' ? Number(field.min) : null;
    const max = field.max !== '' ? Number(field.max) : null;
    let valid = true;
    let message = '';

    if (Number.isNaN(number)) {
      valid = false;
      message = 'Enter a valid number.';
    } else if (min !== null && number < min) {
      valid = false;
      message = `Value should be at least ${min}.`;
    } else if (max !== null && number > max) {
      valid = false;
      message = `Value should be at most ${max}.`;
    }

    field.setCustomValidity(valid ? '' : message);
    return valid;
  };

  fields.forEach((field) => {
    field.addEventListener('input', () => {
      validateField(field);
      field.reportValidity();
    });
    field.addEventListener('blur', () => {
      validateField(field);
    });
  });

  form.addEventListener('submit', (event) => {
    let allValid = true;
    fields.forEach((field) => {
      if (!validateField(field)) allValid = false;
    });

    if (!allValid) {
      event.preventDefault();
      const firstInvalid = fields.find((field) => !field.checkValidity());
      if (firstInvalid) {
        firstInvalid.reportValidity();
        firstInvalid.focus();
      }
    }
  }, true);
}

function formatCurrency(value) {
  return `Rs. ${Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;

async function getLiveWeather() {
  const location = document.getElementById('location').value.trim();
  if (!location) {
    toast('Please enter a location first');
    return;
  }

  try {
    const response = await fetch(`/farmer/api/weather?location=${encodeURIComponent(location)}`);
    const data = await response.json();
    if (data.success) {
      document.querySelector('input[name="temperature"]').value = data.temperature;
      document.querySelector('input[name="humidity"]').value = data.humidity;
      toast('Weather data loaded successfully');
    } else {
      toast(data.error || 'Could not fetch weather data');
    }
  } catch (error) {
    toast('Error fetching weather data');
  }
}

function startSimulation() {
  const crop = recommendationState.recommendations[recommendationState.selectedIndex];
  if (!crop) {
    toast('Choose a crop recommendation before starting the simulation.');
    return;
  }
  window.location.href = `/farmer/simulation?crop=${encodeURIComponent(crop.crop)}`;
}

function showRecommendation(index) {
  const { recommendations, economicsByCrop, parameters } = recommendationState;
  const selectedRecommendation = recommendations[index];

  if (!selectedRecommendation) return;

  recommendationState.selectedIndex = index;
  buildResultMarkup(
    selectedRecommendation,
    economicsByCrop[selectedRecommendation.crop] || {},
    recommendations,
    parameters,
    index
  );
}

function createPlan() {
  if (!lastRecommendation) return;
  toast('Plan created successfully');
}

document.getElementById('recommendationForm').addEventListener('submit', async (event) => {
  if (!event.target.checkValidity()) {
    event.preventDefault();
    return;
  }

  event.preventDefault();

  const submitButton = event.target.querySelector('button[type="submit"]');
  const originalHtml = submitButton.innerHTML;
  const formData = new FormData(event.target);
  const payload = Object.fromEntries(formData.entries());

  submitButton.disabled = true;
  submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

  try {
    const response = await fetch('/farmer/crop-recommendation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.error || 'Error getting recommendation');
    }

    lastRecommendation = result;
    recommendationState = {
      recommendations: result.recommendations || [result.recommendation],
      economicsByCrop: result.economics_by_crop || {
        [result.recommendation.crop]: result.economics || {}
      },
      parameters: result.parameters || {},
      selectedIndex: 0
    };
    showRecommendation(0);
    showResultView();
  } catch (error) {
    toast(error.message || 'Error getting recommendation');
  } finally {
    submitButton.disabled = false;
    submitButton.innerHTML = originalHtml;
  }
});

setupRangeValidation(document.getElementById('recommendationForm'));
</script>
